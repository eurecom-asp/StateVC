[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "statevc"
version = "0.1.0"
description = "StateVC: Shared-State Local Translations for Training-Free Voice Conversion"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.0",
  "torchaudio>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.2",
]

[tool.setuptools.packages.find]
include = ["statevc*"]
